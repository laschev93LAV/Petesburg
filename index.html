<!doctype html>
<html lang="ru">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"

  <body>
    <header class="header">
      <div class="header-logo-box">
        <img
          class="header-logo"
          src="images/sankt-petersburg-seeklogo.png"
          alt="Логотип Санкт-Петербурга"
          width="50"
        />
        <p>Санкт-Петербург</p>
      </div>
      <nav class="nav">
        <input id="burger-toggle" type="checkbox" />
        <label for="burger-toggle">
          <span></span>

        <ul class="nav-link">
          <li><a href="#1" rel="noopener">Достопримечательности</a></li>
          <li><a href="#1" rel="noopener">Машруты</a></li>
          <li><a href="#1" rel="noopener">Галерея</a></li>
          <li><a href="#1" rel="noopener">Контакты</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="hero">
        <h1>Северная венеция</h1>
        <img
          class="hero-image"
          src="images/1.webp"
          alt="Разведенные мосты над Невой"
        />
        <div class="CTA-box">
          <p>От Невы до малых каналов: исследуем Северную Венецию</p>
          <div class="CTA-box-button">
            <label class="postscript" for="button-learn_more"
              >Узнать больше</label
            >
            <button class="CTA-button" id="button-learn_more">↑</button>
          </div>
        </div>
      </section>
      <article></article>
      <footer></footer>
    </main>
